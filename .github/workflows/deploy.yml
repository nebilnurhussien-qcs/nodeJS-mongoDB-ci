name: Deployment Branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


env:
  MONG0DB_DB_NAME: mongodb
  

  
jobs:
  test:
    env:
      MONGODB_CLUSTER_ADDRESS: 'project1.fzm9bgt.mongodb.net'
      MONGODB_USERNAME: 'test_user'
      MONGODB_PASSWORD: 'dOB0pH6nl0bsmrR4'
      PORT: 8080
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm install
      #- name: Run server
        #run: npm start & npx wait-on --timeout 60000 http://127.0.0.1:$PORT
      - name: Run server
        run: |
          npm start 2>&1 &
          npx wait-on --timeout 60000 http://127.0.0.1:$PORT
      - name: Debug server
        if: failure()
        run: timeout 60 npm start
      - name: Run tests
        run: npm test
      - name: Output information
        run: |
          echo "MONGODB_USERNAME: ${{ env.MONGODB_USERNAME }}"
          echo "MONGODB_NAME: ${{ env.MONG0DB_DB_NAME }}"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: |
          echo "..."




