name: Deployment Branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


env:
  MONGODB_DB_NAME: mongodb
  

  
jobs:
  test:
    environment: testing #Shows secret from that environment only
    env: #Allows you to add environment variables 
      MONGODB_CLUSTER_ADDRESS: 'cluster0.sesrr6u.mongodb.net'
      MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      PORT: 8080
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm install
      #- name: Run server
        #run: npm start & npx wait-on --timeout 60000 http://127.0.0.1:$PORT
      - name: Run server
        run: |
          npm start 2>&1 &
          npx wait-on --timeout 60000 http://127.0.0.1:$PORT
      - name: Debug server
        if: failure()
        run: |
          pkill -f "npm start" || true
          timeout 60 npm start
      - name: Run tests
        run: npm test
      - name: Output information
        run: | #Here we are accessing environment variables
          echo "MONGODB_USERNAME: ${{ env.MONGODB_USERNAME }}"
          echo "MONGODB_NAME: ${{ env.MONGODB_DB_NAME }}" 
          
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: |
          echo "...."




